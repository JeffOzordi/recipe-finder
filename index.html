<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
    <title>Recipe Finder App</title>
</head>
<body>
     <div class="toggle_container">
        <input type="checkbox" name="" id="toggle" checked>
        <label for="toggle" class="btn"></label>
    </div>
    <div class="container">
        <div  class="heading" id="heading">
            <h1><i class="fas fa-utensils"></i> Recipe Finder</h1>
            <p>Find delicious recipes from around the world</p>
            <p class="api-link">Data from <a href="http://www.themealdb.com/api.php" target="_blank" rel="noopener noreferrer">TheMealDB</a>👩‍🍳</p> 
        </div>
        <div class="search_container" id="search_container">
            <button id="search_btn"><i class="fas fa-search"></i></button>
            <input type="text" id="search_input" placeholder="Try searching 'Chicken'">
            <button id="delete_btn"><i class="fas fa-times"></i></button>
        </div>
        <div id="error-container" class="hidden"></div>

        <div id="result_heading"></div>
        <div id="meals" class="meal-container"></div>
        <div id="meal-details" class="hidden">
            <button id="back-btn" class="back-btn">Back</button>

            <div id="meals-details-content">

            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
